description:
  de:
    localisedName: TauSense
    genericName: Taupunktsensorik-Backend
    shortDescription: >
      API-Backend für die mobile App TauSense – Eis- und Glättewarnungen
      aus dem Taupunktsensorik-Netz im Landkreis Hof.
    longDescription: >
      Dieses Repository enthält das Django-REST-Backend für **TauSense**, die mobile
      App des Modellprojekts hoferLand.digital (Landkreis Hof). Das System empfängt
      LoRaWAN-Messwerte von Taupunktsensoren, speichert sie in PostgreSQL und stellt
      sie über eine HTTPS-API bereit – inklusive Kartenwarnungen, Verlaufsdiagrammen
      und optionaler Push-Benachrichtigungen bei Eisgefahr.
    features:
      - LoRaWAN-Webhook zur Messwert-Erfassung
      - REST-API mit OpenAPI-Dokumentation (Swagger/ReDoc)
      - Eiswarnlogik mit Ampelstatus (grün, gelb, orange, rot)
      - Verlaufsdaten bis 14 Tage pro Sensor
      - Push-Digest-Benachrichtigungen (Firebase Cloud Messaging)
      - Abonnements nach Gemeinde oder einzelnen Sensoren
    documentation: "https://github.com/kf-PLUS-GmbH/tausense-api/blob/main/README.md"
    apiDocumentation: "https://github.com/kf-PLUS-GmbH/tausense-api#api"
  en:
    localisedName: TauSense
    genericName: Dew-point sensor API
    shortDescription: >
      API backend for the TauSense mobile app – ice and slip warnings
      from the dew-point sensor network in Hof district, Germany.
    longDescription: >
      This repository provides the Django REST backend for **TauSense**, the mobile
      app of the hoferLand.digital smart city project (Landkreis Hof). It ingests
      LoRaWAN sensor readings, stores them in PostgreSQL, and exposes them via
      a HTTPS API including map warnings, history charts, and optional push alerts.
    features:
      - LoRaWAN webhook ingestion
      - REST API with OpenAPI (Swagger/ReDoc)
      - Ice warning levels (green, yellow, orange, red)
      - Up to 14 days of reading history per sensor
      - Digest push notifications (Firebase Cloud Messaging)
      - Subscriptions by municipality or sensor

