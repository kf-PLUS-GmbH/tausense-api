description:
  de:
    localisedName: TauSense
    genericName: Taupunktsensorik-Backend
    shortDescription: >
      API-Backend für die mobile App TauSense – Eis- und Glättewarnungen
      aus dem Taupunktsensorik-Netz im Landkreis Hof.
    longDescription: >
      **TauSense** ist die mobile Anwendung des Modellprojekts hoferLand.digital im
      Landkreis Hof. Sie informiert Bürgerinnen und Bürger sowie Kommunen über
      Glätte- und Eisgefahr entlang des Straßennetzes – gestützt auf ein Netz aus
      Taupunktsensoren (LoRaWAN), die Lufttemperatur, Luftfeuchte und Straßentemperatur
      erfassen.

      Dieses Repository enthält das zugehörige **API-Backend**: Es nimmt Messwerte
      von der Sensor-Infrastruktur entgegen, speichert sie dauerhaft und berechnet
      daraus Warnstufen (Ampel von grün bis rot). Die **TauSense-App** (Android und iOS)
      ruft diese Daten ab – für eine interaktive Karte mit aktuellen Warnungen,
      Detailansichten einzelner Standorte und Verlaufsdiagramme der letzten Tage.

      Nutzerinnen und Nutzer können Gemeinden oder einzelne Sensoren abonnieren und
      bei anhaltender Warnlage optional **Push-Benachrichtigungen** erhalten. Die
      Software ist als Open-Source-Lösung (Apache-2.0) dokumentiert und kann von
      anderen Gebietskörperschaften als Referenz für ähnliche Sensorik-Projekte
      dienen. Technische Integrationsdetails (Webhook, REST, OpenAPI) stehen in der
      Projekt-Dokumentation im Repository.
    features:
      - LoRaWAN-Webhook zur Messwert-Erfassung
      - REST-API mit OpenAPI-Dokumentation (Swagger/ReDoc)
      - Eiswarnlogik mit Ampelstatus (grün, gelb, orange, rot)
      - Verlaufsdaten bis 14 Tage pro Sensor
      - Push-Digest-Benachrichtigungen (Firebase Cloud Messaging)
      - Abonnements nach Gemeinde oder einzelnen Sensoren
    documentation: "https://gitlab.opencode.de/oc000148042427/tausense-api/-/blob/main/README.md"
    apiDocumentation: "https://gitlab.opencode.de/oc000148042427/tausense-api/-/blob/main/README.md#api"
  en:
    localisedName: TauSense
    genericName: Dew-point sensor API
    shortDescription: >
      API backend for the TauSense mobile app – ice and slip warnings
      from the dew-point sensor network in Hof district, Germany.
    longDescription: >
      **TauSense** is the mobile application of the hoferLand.digital pilot project
      in Hof district, Germany. It helps citizens and local authorities stay informed
      about slip and ice risk on the road network, based on a LoRaWAN dew-point
      sensor network measuring air temperature, humidity, and road surface temperature.

      This repository is the **API backend** for that app: it receives sensor
      readings, stores them, and derives warning levels (green through red). The
      **TauSense app** (Android and iOS) consumes the API for an interactive warning
      map, sensor detail views, and multi-day history charts.

      Users can subscribe to municipalities or individual sensors and optionally
      receive **push notifications** while a warning persists. The software is
      released under Apache-2.0 and documented for reuse by other public-sector
      sensor projects. Integration details (webhook, REST, OpenAPI) are in the
      repository documentation.
    features:
      - LoRaWAN webhook ingestion
      - REST API with OpenAPI (Swagger/ReDoc)
      - Ice warning levels (green, yellow, orange, red)
      - Up to 14 days of reading history per sensor
      - Digest push notifications (Firebase Cloud Messaging)
      - Subscriptions by municipality or sensor

